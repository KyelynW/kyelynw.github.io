<!DOCTYPE html>
<!-- This line tells the browser: "this is a modern HTML page." -->
<html lang="en">
<!-- <html> wraps the whole page. lang="en" says the page is in English. -->

<head>
  <!-- The head holds information ABOUT the page. Visitors don't see it on the page itself. -->

  <meta charset="UTF-8">
  <!-- Makes sure special characters (like é or emojis) display properly. -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Makes the page fit properly on phone screens. -->

  <title>Kye | Portfolio</title>
  <!-- This text appears on the browser tab. Change it to your name. -->

  <style>
    /* This is CSS. It controls how things LOOK. */
    body {
      font-family: Arial, sans-serif; /* the font */
      background-color: #fafafa;      /* light grey background */
      color: #1a1a1a;                 /* near-black text */
      text-align: center;             /* center everything */
      padding-top: 100px;             /* empty space at the top */
    }
  </style>
</head>

<body>
  <!-- The body holds everything visitors actually SEE on the page. -->

  <h1>Hello, I'm Kye lyn</h1>
  <!-- <h1> is the biggest heading. Replace the text with your own name. -->

  <p>My portfolio is coming soon.</p>
  <!-- <p> is a paragraph of text. -->
</body>
</html>
